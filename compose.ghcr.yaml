services:
  ilt:
    image: ghcr.io/jawerka/image-localization-tool:1.0.1-cpu-full
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${ILT_PUBLISH_HOST:-127.0.0.1}:${ILT_PORT:-8080}:8080"
    environment:
      ILT_WEB_ORIGINS: "${ILT_WEB_ORIGINS:-http://localhost:${ILT_PORT:-8080},http://127.0.0.1:${ILT_PORT:-8080}}"
    volumes:
      - ilt-data:/opt/ilt/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ilt-data:
