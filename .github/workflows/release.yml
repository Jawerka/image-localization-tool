name: Release Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux sidecar & runtime packs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt pyinstaller py7zr

      - name: Build stdlib.zip
        run: python scripts/build-stdlib-zip.py

      - name: Build sidecar
        run: python -m PyInstaller ImageLocalizationTool.spec --clean --noconfirm

      - name: Assemble server tar.gz
        run: |
          set -eux
          VERSION="${{ steps.meta.outputs.version }}"
          ROOT="dist/server/ImageLocalizationTool"
          mkdir -p "$ROOT"
          cp -r dist/ilt_sidecar/_internal "$ROOT/_internal"
          cp dist/ilt_sidecar/ImageLocalizationTool "$ROOT/"
          cp -r dist/ilt_sidecar/web "$ROOT/web"
          if [ -d dist/ilt_sidecar/fonts ]; then cp -r dist/ilt_sidecar/fonts "$ROOT/fonts"; fi
          for folder in data models runtime; do
            mkdir -p "$ROOT/$folder"
            touch "$ROOT/$folder/.keep"
          done
          cp scripts/deploy-server.sh "$ROOT/deploy.sh"
          sed -i 's/\r$//' "$ROOT/deploy.sh"
          chmod +x "$ROOT/deploy.sh"
          tar -C dist/server -czf "dist/ImageLocalizationTool-${VERSION}-server-linux-x64.tar.gz" ImageLocalizationTool

      - name: Build torch-cpu-linux pack
        run: |
          set -eux
          python -m venv build/runtime-venvs/torch-cpu
          build/runtime-venvs/torch-cpu/bin/pip install --upgrade pip
          build/runtime-venvs/torch-cpu/bin/pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python scripts/build-runtime-pack.py \
            --venv build/runtime-venvs/torch-cpu \
            --kind torch --variant cpu --platform linux --out dist/packs

      - name: Build argos-linux pack
        run: |
          set -eux
          python -m venv build/runtime-venvs/argos
          build/runtime-venvs/argos/bin/pip install --upgrade pip
          build/runtime-venvs/argos/bin/pip install \
            "argostranslate @ git+https://github.com/argosopentech/argos-translate.git"
          python scripts/build-runtime-pack.py \
            --venv build/runtime-venvs/argos \
            --kind argos --platform linux --out dist/packs

      - name: Checksums for Linux assets
        run: |
          set -eux
          cd dist
          sha256sum packs/*.7z ImageLocalizationTool-*-server-linux-x64.tar.gz > SHA256SUMS-linux.txt
          cp packs/packs.json packs-linux.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$VERSION" --notes "Linux assets for $TAG"
          gh release upload "$TAG" \
            dist/packs/*.7z \
            dist/ImageLocalizationTool-*-server-linux-x64.tar.gz \
            dist/packs-linux.json \
            dist/SHA256SUMS-linux.txt \
            --clobber
