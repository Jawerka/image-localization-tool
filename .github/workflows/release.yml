name: Release Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux sidecar & runtime locks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt pyinstaller

      - name: Build stdlib.zip
        run: python scripts/build-stdlib-zip.py

      - name: Build sidecar
        run: python -m PyInstaller ImageLocalizationTool.spec --clean --noconfirm

      - name: Assemble server tar.gz
        run: |
          set -eux
          VERSION="${{ steps.meta.outputs.version }}"
          ROOT="dist/server/ImageLocalizationTool"
          mkdir -p "$ROOT"
          cp -r dist/ilt_sidecar/_internal "$ROOT/_internal"
          cp dist/ilt_sidecar/ImageLocalizationTool "$ROOT/"
          cp -r dist/ilt_sidecar/web "$ROOT/web"
          if [ -d dist/ilt_sidecar/fonts ]; then cp -r dist/ilt_sidecar/fonts "$ROOT/fonts"; fi
          for folder in data models runtime; do
            mkdir -p "$ROOT/$folder"
            touch "$ROOT/$folder/.keep"
          done
          cp scripts/deploy-server.sh "$ROOT/deploy.sh"
          sed -i 's/\r$//' "$ROOT/deploy.sh"
          chmod +x "$ROOT/deploy.sh"
          tar -C dist/server -czf "dist/ImageLocalizationTool-${VERSION}-server-linux-x64.tar.gz" ImageLocalizationTool

      - name: Wait for the hosted argos wheel
        run: |
          set -eux
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p build/argos-wheel
          for i in $(seq 1 60); do
            if gh release download "$TAG" -p 'argostranslate-*.whl' --dir build/argos-wheel --clobber 2>/dev/null; then
              ls -l build/argos-wheel
              exit 0
            fi
            echo "waiting for the argostranslate wheel in $TAG ($i/60)"
            sleep 15
          done
          echo "::error::argostranslate wheel asset not found in release $TAG"
          exit 1

      - name: Build linux locks (no torch install)
        run: |
          set -eux
          python scripts/build_runtime_locks.py --pack torch-cpu --os linux --out dist/locks
          python scripts/build_runtime_locks.py --pack argos --os linux --out dist/locks \
            --hosted-wheel "$(ls build/argos-wheel/argostranslate-*.whl)"

      - name: Check lock reproducibility
        run: |
          set -eux
          mkdir -p build/locks-bootstrap
          for f in dist/locks/py310-*-linux.lock; do
            base="$(basename "$f")"
            if [ -f "locks/$base" ]; then
              diff -u "locks/$base" "$f"
            else
              echo "::warning::locks/$base is missing (bootstrap): commit it from the artifact"
              cp "$f" build/locks-bootstrap/
            fi
          done

      - name: Upload bootstrap locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-locks-bootstrap
          path: build/locks-bootstrap/
          if-no-files-found: ignore

      - name: Checksums for Linux assets
        run: |
          set -eux
          cd dist
          sha256sum ImageLocalizationTool-*-server-linux-x64.tar.gz > SHA256SUMS-linux.txt
          cp locks/packs.json packs-linux.json

      - name: Upload to release
        run: |
          set -eux
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$VERSION" --notes "Linux assets for $TAG"
          gh release upload "$TAG" \
            dist/ImageLocalizationTool-*-server-linux-x64.tar.gz \
            dist/packs-linux.json \
            dist/SHA256SUMS-linux.txt \
            --clobber
