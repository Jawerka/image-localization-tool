target-version = "py310"
extend-exclude = ["legacy", "apps", "models", "runtime", "build", "dist", "venv"]

[lint]
# Явный прежний набор: обновление Ruff не должно менять правила CI по умолчанию.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"scripts/*" = ["E402"]
"src/main.py" = ["E402"]
